heading: Finding stillness in the wild places of Australia
bio1: >-
  I'm Sandy Horne — a nature photographer based in Australia, with a deep love
  for birds and the landscapes they call home. For over 15 years I've been
  venturing into the bush before dawn, waiting in mangroves, and lying in tall
  grass with nothing but patience and a long lens.
bio2: >-
  My work is shaped by a quiet philosophy: the best wildlife images come from
  understanding behaviour, not from chasing shots. Whether it's a kingfisher
  hovering over a creek or a wedge-tailed eagle riding a thermal at sunrise,
  I believe every frame should feel earned.
bio3: >-
  I shoot across Australia — from the tropical wetlands of Kakadu and the
  rainforests of the Daintree, to the alpine country of Victoria and the
  coastal heaths of the south-east. Each ecosystem holds its own light, its
  own rhythms, and its own cast of extraordinary birds.
bio4: >-
  My images have been exhibited nationally and published in Australian wildlife
  and conservation publications. When I'm not in the field, I offer photography
  workshops for anyone who wants to slow down and truly see what's out there.
