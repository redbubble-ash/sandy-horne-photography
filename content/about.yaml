heading: Through Sandy's Lens
bio1: >-
  I'm Sandy Horne and I have to say up-front that I am not a professional
  photographer. This website is to showcase my (amateur) photography and provide
  an answer to those who ask: "Do you have a website?"
bio2: >-
  While I have been interested in birds a very long time, taking photos of them
  has been a relatively new pursuit. I first picked up my cheap DSLR to try to
  get good photos of the parrots that would visit the apple trees in my
  backyard. That was back in around 2013. As time went on, I ventured out to
  local parks and creeks, and then to conservation parks. I gradually upgraded
  my equipment, honed my skills, eventually bought myself a 4WD, and now spend
  as much time as possible out in nature. I call it my therapy. While I'm
  concentrating on getting that perfect shot, I am not thinking about whatever
  else is happening in my life. And I'm getting some exercise into the bargain.
bio3: >-
  Bird photography is my first love, but I will take photos of anything. I mean,
  when I am out taking photos of birds and a gorgeous sunset happens, I really
  want to try to capture it. Moments like that are a gift. And I can never drive
  past an old ruin.
bio4: >-
  I live in Adelaide, the capital city of the state of South Australia, and have
  two grown-up kids. My day job is working for a university as a Project
  Officer.
